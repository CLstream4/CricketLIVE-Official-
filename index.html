    let currentChannel = null;

    function loadMatch(slug) {
        if (!channels[slug]) return;
        
        currentChannel = slug;
        const container = document.getElementById('player-container');
        document.getElementById('loading-skeleton').style.display = 'block';
        
        document.querySelectorAll('.channel-button').forEach(btn => btn.classList.remove('active-channel'));
        const targetBtn = document.querySelector(`[data-slug="${slug}"]`);
        if (targetBtn) {
            targetBtn.classList.add('active-channel');
            document.title = `🔴 LIVE: ${targetBtn.innerText} | CRICKETLIVE!`;
        }
        
        let customClass = (slug === 'willow_ios') ? 'class="zoom-ios"' : '';
        
        // STRICT AD-BLOCKING SANDBOX (Removed allow-popups, allow-top-navigation, allow-forms)
        const sandboxAttr = 'sandbox="allow-scripts allow-same-origin allow-presentation"';

        setTimeout(() => { hideSkeleton(); }, 4000);

        const finalShareUrl = `${window.location.origin}${window.location.pathname}?ch=${slug}`;
        document.getElementById('sharePreview').innerText = finalShareUrl;
        document.getElementById('vip-url-text').innerText = finalShareUrl;
    }

    function refreshPlayer() {
        if (currentChannel) {

    function showUIParts() { if (currentChannel && popupClosed) { document.getElementById('live-signal-box').style.display = 'flex'; document.getElementById('reaction-bar').style.display = 'flex'; } }

    function copyVipMessage() { 
        const linkText = document.getElementById('vip-url-text').innerText;
