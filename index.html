<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>CRICKETLIVE! OFFICIAL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { overflow-x: hidden; width: 100%; position: relative; height: 100dvh;}
        body { margin: 0; background-color: #050810; color: white; font-family: 'Poppins', "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; text-align: center; padding-bottom: 20px; -webkit-tap-highlight-color: transparent; position: relative;}
        
        #entry-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 16, 0.9); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; z-index: 99999; }
        .pop-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .support-text { font-family: 'Bebas Neue', cursive; font-size: 32px; color: #00d2ff; letter-spacing: 2px; margin-bottom: 20px; display: block; }
        .pop-btn { padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; color: white; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); }

        .header { padding: 15px 10px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); }
        .header h1 { font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #00d2ff, #f9a8d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; margin: 0; }

        .video-wrapper { width: 96%; max-width: 850px; margin: 20px auto; background: #000; border: 1px solid rgba(0, 210, 255, 0.5); border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; position: relative; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }
        #main-player { width: 100%; height: 100%; border: 0; position: absolute; left: 0; z-index: 1; background: #000; }
        
        .reaction-bar { display: none; justify-content: center; gap: 12px; margin: 15px auto; flex-wrap: wrap; }
        .react-btn { font-size: 24px; cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); color: white; }

        .share-section { display: none; align-items: center; justify-content: center; gap: 8px; margin: 15px auto; width: 94%; max-width: 500px; }
        .share-input-box { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; color: #00d2ff; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
        .copy-btn { background: #00d2ff; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .wa-btn { background: #25D366; color: white; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 18px; }
        
        .channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px auto 20px auto; max-width: 94%; }
        .channel-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.3); padding: 12px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 13px; }

        .floating-emoji { position: fixed; bottom: 50px; left: 50%; pointer-events: none; font-size: 45px; z-index: 99999; animation: popBounce 2.5s ease-out forwards; }
        @keyframes popBounce { 0% { transform: translateY(0) scale(0); opacity: 0; } 20% { transform: translateY(-50px) scale(1.2); opacity: 1; } 100% { transform: translateY(-500px); opacity: 0; } }

        #social-join-btns { display: none; flex-direction: column; gap: 10px; align-items: center; margin: 15px auto; width: 90%; max-width: 500px; }
        .join-btn-base { width: 100%; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px;}
        
        .floating-social-btns { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 999; }
        .float-btn { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: white; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="entry-popup">
    <div class="pop-box">
        <div class="support-text">📢 JOIN US</div>
        <a href="https://whatsapp.com/channel/0029Vb9sfuABA1eqJmiFc91q" class="pop-btn" style="background:#25D366;"><i class="fab fa-whatsapp"></i> WHATSAPP</a>
        <a href="https://t.me/TheCricketLIVEOfficial" class="pop-btn" style="background:#0088cc;"><i class="fab fa-telegram"></i> TELEGRAM</a>
        <div style="margin-top:18px; cursor:pointer; font-size:11px; color:#00d2ff;" onclick="closePopup()">CONTINUE TO STREAM</div>
    </div>
</div>

<header class="header"><h1>CRICKETLIVE! OFFICIAL</h1></header>

<div class="video-wrapper">
    <div id="player-container">
        <div style="color: #64748b; padding-top: 20%;">Select Channel to Play</div>
    </div>
</div>

<div class="reaction-bar" id="reaction-bar">
    <div class="react-btn" onclick="react('🔥')">🔥</div>
    <div class="react-btn" onclick="react('6️⃣')">6️⃣</div>
    <div class="react-btn" onclick="react('🏏')">🏏</div>
    <div class="react-btn" onclick="react('4️⃣')">4️⃣</div>
    <div class="react-btn" onclick="react('👏')">👏</div>
</div>

<div class="share-section" id="share-box">
    <div class="share-input-box" id="share-url-text">URL Loading...</div>
    <button class="copy-btn" onclick="copyLink()">COPY</button>
    <a href="#" id="wa-share-link" class="wa-btn" target="_blank"><i class="fab fa-whatsapp"></i></a>
</div>

<div class="channel-grid" id="main-grid"></div>

<div id="social-join-btns">
    <a href="https://whatsapp.com/channel/0029Vb9sfuABA1eqJmiFc91q" class="join-btn-base" style="border: 1px solid #25D366; background: rgba(37, 211, 102, 0.1);"><i class="fab fa-whatsapp"></i> Join WhatsApp Channel</a>
    <a href="https://t.me/TheCricketLIVEOfficial" class="join-btn-base" style="border: 1px solid #0088cc; background: rgba(0, 136, 204, 0.1);"><i class="fab fa-telegram"></i> Join Telegram Channel</a>
</div>

<div class="floating-social-btns">
    <a href="https://whatsapp.com/channel/0029Vb9sfuABA1eqJmiFc91q" class="float-btn" style="background: #25D366;"><i class="fab fa-whatsapp"></i></a>
    <a href="https://t.me/TheCricketLIVEOfficial" class="float-btn" style="background: #0088cc;"><i class="fab fa-telegram"></i></a>
</div>

<script>
    const channels = {
        "ss1_hd": { name: "Star Sports 1 HD", url: "https://shwe7ank-jeeyo.netlify.app/watch?id=ss1" },
        "ss1_hin": { name: "Star Sports 1 HD Hindi", url: "https://shwe7ank-jeeyo.netlify.app/watch?id=ss1h" },
        "ss_tam": { name: "Star Sports Tamil", url: "https://shwe7ank-jeeyo.netlify.app/watch?id=ss1tam" },
        "ss_tel": { name: "Star Sports Telugu", url: "https://shwe7ank-jeeyo.netlify.app/watch?id=ss1tel" },
        "ss1_sd_hin": { name: "Star Sports 1 SD Hindi", url: "https://tv4live.pages.dev?id=ss1h" },
        "hotstar": { name: "Hotstar", url: "https://tvgotk.wapka.fun/hotstar" },
        "ss2_hin": { name: "Star Sports 2 HD Hindi", url: "https://shotball.pages.dev/HIN" },
        "ss2_eng": { name: "Star Sports 2 HD", url: "https://shotball.pages.dev/ENG" },
        "ss3": { name: "Star Sports 3", url: "https://toxify-tv2.pages.dev/?id=eng" },
        "willow": { name: "Willow Cricbuzz", url: "https://tvgotk.wapka.fun/hotstar" },
        "willow_eng": { name: "Willow Cricbuzz Eng", url: "https://toxify-tv2.pages.dev/?id=willow" },
        "sky1": { name: "Sky Sports 1", url: "https://toxify-tv2.pages.dev/?id=sky-sports-nz" },
        "fox": { name: "Fox Sports", url: "https://toxify-tv2.pages.dev/?id=jio-hotstar" }
    };

    function initGrid() {
        const urlParams = new URLSearchParams(window.location.search);
        const channelKey = urlParams.get('ch');

        if (channelKey && channels[channelKey]) {
            document.getElementById('main-grid').style.display = 'none';
            loadMatch(channelKey, true);
        } else {
            const grid = document.getElementById('main-grid');
            for (const key in channels) {
                const btn = document.createElement('button');
                btn.className = 'channel-btn';
                btn.innerText = channels[key].name;
                btn.onclick = () => loadMatch(key);
                grid.appendChild(btn);
            }
        }
    }

    function loadMatch(key, isShareMode = false) {
        const channel = channels[key];
        const container = document.getElementById('player-container');
        container.innerHTML = `<iframe id="main-player" src="${channel.url}" allowfullscreen allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms" referrerpolicy="no-referrer"></iframe>`;
        
        document.getElementById('reaction-bar').style.display = 'flex';
        document.getElementById('share-box').style.display = 'flex';
        document.getElementById('social-join-btns').style.display = 'flex';
        
        const shareURL = window.location.origin + window.location.pathname + "?ch=" + key;
        document.getElementById('share-url-text').innerText = shareURL;
        document.getElementById('wa-share-link').href = "https://api.whatsapp.com/send?text=" + encodeURIComponent("🏏 Watch Live: " + shareURL);
    }

    function copyLink() {
        const text = document.getElementById('share-url-text').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("Channel Link Copied!");
        });
    }

    function closePopup() { document.getElementById('entry-popup').style.display = 'none'; }
    
    function react(emoji) { 
        const el = document.createElement('div'); 
        el.className = 'floating-emoji'; 
        el.innerText = emoji; 
        el.style.left = (Math.random() * 60 + 20) + '%'; 
        document.body.appendChild(el); 
        setTimeout(() => el.remove(), 2500); 
    }

    window.onload = initGrid;
</script>
</body>
</html>
