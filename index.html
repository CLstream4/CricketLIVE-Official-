        };

        let activeId = 'ss1_sd';

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('popup').classList.add('show');
            const params = new URLSearchParams(window.location.search);
            if(params.has('share')) {
                const targetId = params.get('share');
                if(channelMap[targetId]) {
                    document.body.classList.add('share-mode');
                    activeId = targetId;
                    document.getElementById('player').src = channelMap[targetId];
                }
            }
        });

        function hidePopup() { 
            document.getElementById('popup').classList.remove('show'); 
        }

        function loadCh(url, id, btn) {
            activeId = id;
            const player = document.getElementById('player');
            player.src = '';
            setTimeout(() => { player.src = url; }, 50);
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        function copyLink() {
            const cleanShareUrl = window.location.origin + window.location.pathname + '?share=' + activeId;
            navigator.clipboard.writeText(cleanShareUrl).then(() => {
                alert('Link copied: ' + cleanShareUrl);
            });
        }

        // NEW: Share direct to WhatsApp Function
        function shareToWhatsAppDirect() {
            const cleanShareUrl = window.location.origin + window.location.pathname + '?share=' + activeId;
            const shareText = "Watch Live Cricket Match Stream Here: " + cleanShareUrl;
            window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText), "_blank");
        }

        // NEW: Fullscreen Auto-Rotate to Landscape logic
        const lockOrientation = () => {
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(err => console.log("Orientation lock not supported or failed"));
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        };

        document.addEventListener("fullscreenchange", lockOrientation);
        document.addEventListener("webkitfullscreenchange", lockOrientation);
        document.addEventListener("mozfullscreenchange", lockOrientation);
    </script>
