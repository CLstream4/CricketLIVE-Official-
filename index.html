<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>CRICKETLIVE! OFFICIAL</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { overflow-x: hidden; width: 100%; position: relative; }
        body { margin: 0; background-color: #050810; color: white; font-family: 'Poppins', sans-serif; text-align: center; padding-bottom: 20px; -webkit-tap-highlight-color: transparent; }
        
        #entry-popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 8, 16, 0.9); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; z-index: 99999; }
        .pop-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .support-text { font-family: 'Bebas Neue', cursive; font-size: 32px; color: #00d2ff; letter-spacing: 2px; margin-bottom: 20px; display: block; }
        .pop-btn { padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; color: white; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); }

        .header { padding: 15px 10px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); }
        .header h1 { font-family: 'Orbitron', sans-serif; background: linear-gradient(90deg, #00d2ff, #f9a8d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; margin: 0; }

        .video-wrapper { width: 96%; max-width: 850px; margin: 20px auto; background: #000; border: 1px solid rgba(0, 210, 255, 0.5); border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; position: relative; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); }
        #main-player { width: 100%; height: 100%; border: 0; position: absolute; left: 0; z-index: 1; background: #000; }
        
        .reaction-bar { display: none; justify-content: center; gap: 12px; margin: 15px auto; }
        .react-btn { font-size: 24px; cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2); color: white; }
        
        .channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px auto 20px auto; max-width: 94%; }
        .channel-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.3); padding: 12px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 13px; }

        .floating-emoji { position: fixed; bottom: 50px; left: 50%; pointer-events: none; font-size: 45px; z-index: 99999; animation: popBounce 2.5s ease-out forwards; }
        @keyframes popBounce { 0% { transform: translateY(0) scale(0); opacity: 0; } 20% { transform: translateY(-50px) scale(1.2); opacity: 1; } 100% { transform: translateY(-500px) opacity: 0; } }

        .social-container { display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 15px auto; width: 90%; }
        .join-btn-base { width: 100%; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>

<div id="entry-popup">
    <div class="pop-box">
        <div class="support-text">🚀 JOIN US</div>
        <a href="https://whatsapp.com/channel/0029Vb9sfuABA1eqJmiFc91q" class="pop-btn" style="background:#25D366;"><i class="fab fa-whatsapp"></i> WHATSAPP</a>
        <a href="https://t.me/TheCricketLIVEOfficial" class="pop-btn" style="background:#0088cc;"><i class="fab fa-telegram"></i> TELEGRAM</a>
        <div style="margin-top:18px; cursor:pointer; font-size:11px; color:#00d2ff;" onclick="closePopup()">CONTINUE TO STREAM</div>
    </div>
</div>

<header class="header"><h1>CRICKETLIVE! OFFICIAL</h1></header>

<div class="video-wrapper">
    <div id="player-container">
        <div style="color: #64748b; padding-top: 20%;">Select Channel to Play</div>
    </div>
</div>

<div class="reaction-bar" id="reaction-bar">
    <div class="react-btn" onclick="react('🔥')">🔥</div>
    <div class="react-btn" onclick="react('6️⃣')">6️⃣</div>
    <div class="react-btn" onclick="react('❤️')">❤️</div>
    <div class="react-btn" onclick="react('4️⃣')">4️⃣</div>
</div>

<div class="channel-grid" id="main-grid"></div>

<div class="social-container">
    <a href="https://whatsapp.com/channel/0029Vb9sfuABA1eqJmiFc91q" class="join-btn-base" style="border: 1px solid #25D366;">Join WhatsApp</a>
    <a href="https://t.me/TheCricketLIVEOfficial" class="join-btn-base" style="border: 1px solid #0088cc;">Join Telegram</a>
</div>

<script>
    const channels = {
        "Hotstar": "https://tvgotk.wapka.fun/hotstar",
        "Star Sports 2 Hindi": "https://estrav.pages.dev/c3?id=H2",
        "Star Sports 2 HD": "https://estrav.pages.dev/c3?id=E2",
        "Willow Cricbuzz": "https://tvgotk.wapka.fun/hotstar",
        "Willow Cricbuzz Eng": "https://toxify-tv2.pages.dev/?id=willow",
        "Sky Sports 1": "https://toxify-tv2.pages.dev/?id=sky-sports-nz",
        "Fox Sports": "https://toxify-tv2.pages.dev/?id=jio-hotstar"
    };

    function initGrid() {
        const grid = document.getElementById('main-grid');
        for (const name in channels) {
            const btn = document.createElement('button');
            btn.className = 'channel-btn';
            btn.innerText = name;
            btn.onclick = () => loadMatch(channels[name]);
            grid.appendChild(btn);
        }
    }

    function loadMatch(url) {
        const container = document.getElementById('player-container');
        // sandbox attribute add kiya hai popups rokne ke liye
        container.innerHTML = `<iframe id="main-player" src="${url}" allowfullscreen allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms" referrerpolicy="no-referrer"></iframe>`;
        document.getElementById('reaction-bar').style.display = 'flex';
    }

    function closePopup() { document.getElementById('entry-popup').style.display = 'none'; }
    
    function react(emoji) { 
        const el = document.createElement('div'); 
        el.className = 'floating-emoji'; 
        el.innerText = emoji; 
        el.style.left = (Math.random() * 60 + 20) + '%'; 
        document.body.appendChild(el); 
        setTimeout(() => el.remove(), 2500); 
    }

    window.onload = initGrid;
</script>
</body>
</html>
