<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRICKETLIVE! OFFICIAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background-color: #050810; color: white; font-family: 'Poppins', sans-serif; text-align: center; padding-bottom: 30px; }
        .header { padding: 20px; background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid #00d2ff; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 22px; margin: 0; color: #00d2ff; }
        
        .video-box { width: 94%; max-width: 800px; margin: 20px auto; background: #000; border-radius: 12px; aspect-ratio: 16/9; overflow: hidden; position: relative; border: 1px solid rgba(0,210,255,0.3); }
        iframe { width: 100%; height: 100%; border: 0; }

        .ns-option-box { background: rgba(255, 255, 255, 0.05); margin: 15px auto; width: 90%; max-width: 500px; padding: 20px; border-radius: 15px; border: 1px dashed #00d2ff; }
        .ns-title { color: #f9a8d4; font-weight: bold; margin-bottom: 10px; display: block; }
        
        /* NS PLAYER BUTTON */
        .ns-btn { 
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(90deg, #00d2ff, #0072ff); color: white; 
            padding: 15px 25px; border-radius: 10px; text-decoration: none; font-weight: bold;
            font-size: 16px; width: 80%; margin-top: 10px; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }

        .channel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .ch-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(0,210,255,0.2); padding: 12px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; font-size: 12px; }
        .active { background: #00d2ff !important; color: black !important; }
        
        .footer-text { font-size: 11px; color: #64748b; margin-top: 15px; line-height: 1.5; }
    </style>
</head>
<body>

<header class="header"><h1>CRICKETLIVE! OFFICIAL</h1></header>

<div class="video-box">
    <div id="player-container">
        <div style="padding-top: 20%; color: #475569;">Select a channel to play</div>
    </div>
</div>

<div class="ns-option-box" id="ns-section" style="display: none;">
    <span class="ns-title">BEST QUALITY IN NS PLAYER</span>
    <p style="font-size: 12px; margin-bottom: 15px;">Agar browser me buffer ho raha hai toh niche click karein:</p>
    
    <a href="#" id="ns-deep-link" class="ns-btn">
        <i class="fas fa-play-circle"></i> WATCH IN NS PLAYER
    </a>

    <div class="footer-text">
        Note: Click karne par NS Player app open hogi.<br>
        Agar app nahi hai toh <a href="https://play.google.com/store/apps/details?id=com.lazygeniouz.video.player.pro" style="color:#00d2ff;">PlayStore se download karein</a>.
    </div>
</div>

<div class="channel-grid">
    <button class="ch-btn" onclick="playMatch('willow', this)">Willow Hindi (HLS)</button>
    <button class="ch-btn" onclick="playMatch('ss1', this)">Star Sports 1</button>
    <button class="ch-btn" onclick="playMatch('hotstar', this)">Jio Hotstar</button>
</div>

<script>
    const streamLinks = {
        'willow': 'https://sonu-cricbuzz-proxy.pages.dev/SONU/Willow_HIN.m3u8|User-Agent=https://sayan-mete.pages.dev/&Referer=https://player-sonu.pages.dev/',
        'ss1': 'https://shotball.pages.dev/HIN',
        'hotstar': 'https://tvgotk.wapka.fun/hotstar'
    };

    function playMatch(slug, btn) {
        const container = document.getElementById('player-container');
        const nsSection = document.getElementById('ns-section');
        const nsLink = document.getElementById('ns-deep-link');
        
        // Active button UI
        document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // 1. Iframe Player Load (Browser ke liye)
        // Shotball links ke liye 'allow-modals' nikal diya hai taaki popup na aaye
        let frameSrc = streamLinks[slug];
        if(!frameSrc.includes('pages.dev')) {
             container.innerHTML = `<iframe src="${frameSrc}" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation allow-top-navigation" allow="autoplay; fullscreen"></iframe>`;
        } else {
             container.innerHTML = `<div style="padding-top:20%; font-size:13px; color:#f9a8d4;">Yeh link sirf NS Player me chalegi niche dekhein 👇</div>`;
        }

        // 2. NS Player Intent Link Setup
        // Hum link ko intent format me convert kar rahe hain
        let rawLink = streamLinks[slug].split('|')[0]; // Sirf .m3u8 wala part
        let intentLink = `intent://${rawLink.replace('https://', '')}#Intent;scheme=https;package=com.lazygeniouz.video.player.pro;end`;
        
        nsLink.href = intentLink;
        nsSection.style.display = 'block';
    }
</script>

</body>
</html>
